name: Публикация релиза

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      pool:
        description: Пул хаба
        required: false
        default: default

# Доверенная публикация: хаб принимает OIDC id-token конвейера вместо PUSH_TOKEN
permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: autumn-library/workflows/.github/workflows/release.yml@main
    with:
      package_mask: "lambdas-*.ospx"
      trusted_publishing: true
      pool: ${{ inputs.pool }}
